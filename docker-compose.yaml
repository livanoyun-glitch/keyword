services:
  panel:
    build: .
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "8765"
      DATA_DIR: /app/data
      OPEN_BROWSER: "0"
      PLAYWRIGHT_DOCKER: "1"
      MAX_CONCURRENT: "3"
      CHECK_INTERVAL_SECONDS: "3"
      PROXY_SERVER: "socks5://ddd817fa8b6e8d6729f8:6a4c0717f643a9d8@gw.dataimpulse.com:824"
    ports:
      - "8765"
    expose:
      - "8765"
    volumes:
      - panel-data:/app/data
    shm_size: "2gb"
    mem_limit: 4g
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  panel-data:
